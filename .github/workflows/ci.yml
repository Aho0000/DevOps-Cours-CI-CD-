name: TrainShop Starter CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  test-api:
    name: Tester API
    runs-on: ubuntu-latest

    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      - name: Installer Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Installer les dépendances
        working-directory: ./api
        run: npm install

      - name: Vérifier la qualité du code
        working-directory: ./api
        run: npm run lint

      - name: Lancer les tests
        working-directory: ./api
        run: npm test

  docker-build:
    name: Vérifier les builds Docker
    runs-on: ubuntu-latest
    needs: test-api

    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      - name: Construire l'image Docker de l'API
        run: docker build -t trainshop-api ./api

      - name: Construire l'image Docker du frontend
        run: docker build -t trainshop-frontend ./frontend

  docker-health-check:
    name: Vérifier la santé du container API
    runs-on: ubuntu-latest
    needs: docker-build

    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      - name: Construire l'image Docker de l'API
        run: docker build -t trainshop-api ./api

      - name: Démarrer le container
        run: |
          docker run -d \
            --name trainshop-api-test \
            -p 3000:3000 \
            -e API_PORT=3000 \
            trainshop-api
          sleep 2

      - name: Attendre que l'API démarre
        run: |
          for i in {1..40}; do
            if curl -s http://localhost:3000/health | grep -q 'ok'; then
              echo "✓ API is ready"
              exit 0
            fi
            echo "Tentative $i/40, en attente du démarrage..."
            sleep 1
          done
          echo "✗ L'API n'a pas démarré à temps"
          exit 1

      - name: Tester l'endpoint /health
        run: |
          response=$(curl -s http://localhost:3000/health)
          echo "Réponse /health: $response"

          if [ -z "$response" ]; then
            echo "✗ Pas de réponse du serveur"
            exit 1
          fi

          if echo "$response" | grep -q 'ok'; then
            echo "✓ L'endpoint /health répond correctement"
          else
            echo "✗ L'endpoint /health ne répond pas correctement"
            exit 1
          fi

      - name: Afficher les logs du container
        if: always()
        run: docker logs trainshop-api-test

      - name: Arrêter et nettoyer le container
        if: always()
        run: docker stop trainshop-api-test && docker rm trainshop-api-test
